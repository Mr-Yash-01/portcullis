# Users and permissions come from the ACL file (generated by scripts/gen-secrets.sh).
# The default user is disabled, so every client must log in as its own service user.
aclfile /run/secrets/redis_acl
port 6379
protected-mode yes

# Durability: revocations and queued audit events must survive a restart.
dir /data
appendonly yes
appendfsync everysec

# Never evict keys: dropping a revocation or lockout entry would weaken security,
# so when memory is full writes fail instead (fail closed).
maxmemory 200mb
maxmemory-policy noeviction
