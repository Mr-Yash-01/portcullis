# Portcullis gateway: serves the UI and is the only entry point to the API microservices.

# Real client IP. Google's load balancer appends "<client-ip>,<lb-ip>" to X-Forwarded-For, so take the
# second-to-last entry; anything a client puts in the header itself lands further left and is ignored.
# ponytail: with no LB in front (local docker-compose) a client could still spoof this; fine for dev only.
map $http_x_forwarded_for $client_ip {
    "~(?<ip>[0-9A-Fa-f.:]+)\s*,\s*[0-9A-Fa-f.:]+\s*$" $ip;
    default $remote_addr;
}

# API responses must never be cached; the UI is revalidated so a rollout is picked up at once.
map $uri $cache_control {
    "~^/api/" "no-store";
    default   "no-cache";
}

limit_req_zone  $client_ip zone=login:10m rate=10r/m;   # credential endpoints: anti brute force
limit_req_zone  $client_ip zone=api:10m   rate=50r/s;   # everything else: anti flood
limit_conn_zone $client_ip zone=conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 8080;
    server_tokens off;                      # don't advertise the nginx version

    # Slowloris / oversized-request protection.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_conn conn 40;

    # Browser hardening on every response, including errors.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    # Only the methods the API uses.
    if ($request_method !~ ^(GET|HEAD|POST|PATCH)$) { return 405; }

    # What the microservices see: the verified client IP, and no client-controlled forwarding headers.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    location = /healthz {                   # load balancer health check
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://auth:8000;
    }
    location /api/auth/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://auth:8000;
    }
    location /api/directory/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://directory:8000;
    }
    location /api/audit/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://audit:8000;
    }
    location /api/ {
        return 404;
    }
}
