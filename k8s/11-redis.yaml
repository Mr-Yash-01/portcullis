---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: portcullis
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: portcullis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false                    # no auto-injected *_PORT env vars (they clash with REDIS_PORT etc.)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999                             # "redis" user in the alpine image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports: [{containerPort: 6379}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 6379}                # PING needs a login: the default user is disabled
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/redis, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: config
          configMap: {name: redis-config}
        - name: secrets
          secret: {secretName: redis-secrets, defaultMode: 0440}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard-rwo
        resources:
          requests: {storage: 10Gi}
