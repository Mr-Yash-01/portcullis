---
apiVersion: v1
kind: Service
metadata:
  name: directory
  namespace: portcullis
spec:
  selector: {app: directory}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directory
  namespace: portcullis
  annotations:
    kubernetes.io/change-cause: "v1 initial release"
spec:
  replicas: 2
  revisionHistoryLimit: 5                          # old ReplicaSets kept for `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}  # zero-downtime: a new pod is Ready before an old one stops
  selector:
    matchLabels: {app: directory}
  template:
    metadata:
      labels: {app: directory}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false                    # no auto-injected *_PORT env vars (they clash with REDIS_PORT etc.)
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:                   # spread replicas over nodes: a node failure can't take all of them
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: directory}}
      containers:
        - name: directory
          image: IMAGE_REPO/directory:v1
          ports: [{containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}   # let in-flight requests finish during rollouts
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: directory-secrets, defaultMode: 0440}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: directory
  namespace: portcullis
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: directory}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 60}    # scale back in after 1 min of low load (default 5)
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: directory
  namespace: portcullis
spec:
  minAvailable: 1                                  # node drains/upgrades always leave one replica running
  selector:
    matchLabels: {app: directory}
